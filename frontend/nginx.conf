# Reverse-proxy KORA : sert le frontend (SPA) + proxifie l'API et les
# montages statiques du backend (renders, assets, audio, design…).
server {
    listen 80;
    server_name _;

    # Uploads (PDF, vidéos, images) — adapte si besoin.
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de proxy communs.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;   # rendus vidéo longs

    # --- Backend FastAPI (service "backend" du compose) ---
    location /api/           { proxy_pass http://backend:8000; }
    location = /health       { proxy_pass http://backend:8000; }
    location /docs           { proxy_pass http://backend:8000; }
    location /openapi.json   { proxy_pass http://backend:8000; }
    location /renders/       { proxy_pass http://backend:8000; }
    location /assets/        { proxy_pass http://backend:8000; }
    location /audio/         { proxy_pass http://backend:8000; }
    location /audio_sources/ { proxy_pass http://backend:8000; }
    location /design/        { proxy_pass http://backend:8000; }

    # --- SPA (fallback vers index.html) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
